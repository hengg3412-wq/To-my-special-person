<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Someone Special 💖</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff758c,#ff7eb3);
    overflow:hidden;
    position:relative;
}

/* CARD */

.card{
    width:360px;
    max-width:90%;
    padding:40px 25px;
    border-radius:25px;
    text-align:center;

    background:rgba(255,255,255,0.18);

    backdrop-filter:blur(12px);

    border:1px solid rgba(255,255,255,0.3);

    box-shadow:0 10px 30px rgba(0,0,0,0.2);

    animation:cardFloat 3s ease-in-out infinite;

    transition:0.5s;

    z-index:10;
}

/* CARD FLOAT */

@keyframes cardFloat{

    0%{
        transform:translateY(0px);
    }

    50%{
        transform:translateY(-10px);
    }

    100%{
        transform:translateY(0px);
    }
}

/* SMOOTH TRANSITION */

.fade{
    animation:smoothFade 0.6s ease;
}

@keyframes smoothFade{

    0%{
        opacity:0;
        transform:
        translateY(20px)
        scale(0.95);
    }

    100%{
        opacity:1;
        transform:
        translateY(0px)
        scale(1);
    }
}

/* EMOJI */

.emoji{
    font-size:70px;
    margin-bottom:15px;

    animation:
    emojiPop 0.6s ease,
    emojiFloat 2s ease-in-out infinite;
}

/* EMOJI POP */

@keyframes emojiPop{

    0%{
        opacity:0;
        transform:
        scale(0.3)
        rotate(-20deg);
    }

    60%{
        transform:
        scale(1.2)
        rotate(10deg);
    }

    100%{
        opacity:1;
        transform:
        scale(1)
        rotate(0deg);
    }
}

/* EMOJI FLOAT */

@keyframes emojiFloat{

    0%{
        transform:translateY(0px);
    }

    50%{
        transform:translateY(-8px);
    }

    100%{
        transform:translateY(0px);
    }
}

/* TEXT */

h1{
    color:white;
    font-size:34px;
    margin-bottom:15px;

    text-shadow:0 2px 5px rgba(0,0,0,0.2);
}

p{
    color:white;
    font-size:22px;
    line-height:1.4;
    margin-bottom:25px;
}

/* BUTTONS */

button{

    border:none;

    padding:13px 30px;

    margin:10px;

    border-radius:40px;

    font-size:18px;

    cursor:pointer;

    transition:0.3s;

    font-weight:bold;
}

button:hover{

    transform:
    scale(1.08)
    translateY(-2px);
}

.yes{

    background:white;

    color:#ff4f7b;
}

.no{

    background:rgba(255,255,255,0.3);

    color:white;
}

/* HEARTS */

.heart{

    position:absolute;

    top:-20px;

    color:white;

    pointer-events:none;

    animation:heartFall linear forwards;
}

/* HEART FALL */

@keyframes heartFall{

    to{

        transform:translateY(110vh);

        opacity:0;
    }
}

</style>
</head>

<body>

<div class="card fade" id="box">

    <div class="emoji">💖</div>

    <h1>Hey You</h1>

    <p>Do you love me?</p>

    <button class="yes"
    onclick="firstAnswer('Yes')">

        Yes 💕

    </button>

    <button class="no"
    onclick="firstAnswer('No')">

        No 😭

    </button>

</div>

<script>

/* TELEGRAM */

const BOT_TOKEN =
"8770173806:AAHVHhv-UAC0Uzpp-Lh2L3-SsrUFwFzmVIU";

const CHAT_ID =
"7313735579";

/* SEND TO TELEGRAM */

async function sendToTelegram(message){

    const url =
    `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;

    try{

        await fetch(url,{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({

                chat_id:CHAT_ID,

                text:message
            })
        });

    }catch(error){

        console.log(error);
    }
}

/* FIRST QUESTION */

function firstAnswer(answer){

    sendToTelegram(
        "💖 First Question Answer: " + answer
    );

    const box =
    document.getElementById("box");

    /* YES */

    if(answer === "Yes"){

        box.innerHTML = `
        
            <div class="emoji">🥰</div>

            <h1>YAYYY ❤️</h1>

            <p>
                Can you be my girlfriend forever?
            </p>

            <button class="yes"
            onclick="foreverAnswer('Yes')">

                Yes 💍

            </button>

            <button class="no"
            onclick="foreverAnswer('No')">

                No 😭

            </button>
        
        `;

    }

    /* NO */

    else{

        box.innerHTML = `
        
            <div class="emoji">😢</div>

            <h1>Aww...</h1>

            <p>
                Anyway... can you still
                be my girlfriend?
            </p>

            <button class="yes"
            onclick="girlfriendAnswer('Yes')">

                Okay 💖

            </button>

            <button class="no"
            onclick="girlfriendAnswer('No')">

                Still No 💔

            </button>
        
        `;
    }

    box.classList.add("fade");
}

/* SECOND QUESTION */

function girlfriendAnswer(answer){

    sendToTelegram(
        "💕 Girlfriend Question Answer: " + answer
    );

    const box =
    document.getElementById("box");

    /* YES */

    if(answer === "Yes"){

        box.innerHTML = `
        
            <div class="emoji">🥺</div>

            <h1>One More Question ❤️</h1>

            <p>Forever?</p>

            <button class="yes"
            onclick="finalAnswer('Yes')">

                Forever 💍

            </button>

            <button class="no"
            onclick="finalAnswer('No')">

                No 😭

            </button>
        
        `;

    }

    /* NO */

    else{

        finalAnswer("No");
    }

    box.classList.add("fade");
}

/* FOREVER QUESTION */

function foreverAnswer(answer){

    sendToTelegram(
        "💍 Forever Question Answer: " + answer
    );

    finalAnswer(answer);
}

/* FINAL ANSWER */

function finalAnswer(answer){

    sendToTelegram(
        "❤️ Final Answer: " + answer
    );

    const box =
    document.getElementById("box");

    /* YES */

    if(answer === "Yes"){

        sendToTelegram(
            "🎉 SHE SAID YES FOREVER ❤️"
        );

        box.innerHTML = `
        
            <div class="emoji">💍</div>

            <h1>OMGGG ❤️</h1>

            <p>
                You just made me the
                happiest person alive 🥺💕
            </p>
        
        `;

    }

    /* NO */

    else{

        sendToTelegram(
            "💔 She said no"
        );

        box.innerHTML = `
        
            <div class="emoji">😭</div>

            <h1>It's Okay...</h1>

            <p>
                You'll always be special
                to me 💖
            </p>
        
        `;
    }

    box.classList.add("fade");
}

/* FLOATING HEARTS */

function createHeart(){

    const heart =
    document.createElement("div");

    heart.classList.add("heart");

    heart.innerHTML = "💖";

    heart.style.left =
    Math.random() * window.innerWidth + "px";

    heart.style.fontSize =
    (Math.random() * 20 + 15) + "px";

    heart.style.animationDuration =
    (Math.random() * 3 + 2) + "s";

    document.body.appendChild(heart);

    setTimeout(()=>{

        heart.remove();

    },5000);
}

setInterval(createHeart,250);

</script>

</body>
</html>
